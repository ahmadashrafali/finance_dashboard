<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Space+Grotesk:wght@500;600;700&family=IBM+Plex+Mono:wght@500;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#0C0E12;--card:#151920;--line:#232833;--line2:#1B2029;--edge:#3A4250;--tx:#ECEAE4;--mut:#A3AAB8;--dim:#6E7684;
--brass:#D8B15A;--ok:#4CC9A6;--warn:#EDB04A;--bad:#FF8A5C;--blue:#7FB2FF;--band:#2E6B5C;
--c1:#3987e5;--c2:#d95926;--c3:#199e70;--c4:#c98500;--c5:#d55181;
--head:'Space Grotesk',system-ui,sans-serif;--body:Inter,system-ui,sans-serif;--mono:'IBM Plex Mono',ui-monospace,monospace}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--tx);font-family:var(--body);font-size:15px;line-height:1.45;-webkit-font-smoothing:antialiased}
body{overflow-x:hidden}
button,input,select,textarea{font-family:inherit;font-size:inherit;color:inherit}
button{cursor:pointer}
a{color:inherit;text-decoration:none}
#app{max-width:480px;margin:0 auto;min-height:100vh;display:flex;flex-direction:column}
#view{flex:1;padding:22px 20px 110px;display:flex;flex-direction:column;gap:18px}
h1{margin:0;font-family:var(--head);font-size:26px;font-weight:700;letter-spacing:-.3px}
h2{margin:0;font-family:var(--head);font-size:17px;font-weight:600}
.sub{font-size:13px;color:var(--mut)}
.tiny{font-size:12px;color:var(--mut)}
.mono{font-family:var(--mono);font-variant-numeric:tabular-nums}
.big{font-family:var(--mono);font-size:38px;font-weight:600;letter-spacing:-1px;line-height:1.1}
.card{background:var(--card);border-radius:18px;padding:16px}
.row{display:flex;align-items:center;gap:12px}
.between{display:flex;justify-content:space-between;align-items:center;gap:10px}
.grow{flex:1;min-width:0}
.ok{color:var(--ok)}.warn{color:var(--warn)}.bad{color:var(--bad)}.mutc{color:var(--mut)}.brass{color:var(--brass)}
.chip{font-size:12px;font-weight:600;border:1px solid currentColor;border-radius:10px;padding:3px 8px;white-space:nowrap}
.tag{font-size:11px;border:1px solid currentColor;border-radius:10px;padding:1px 7px;white-space:nowrap}
.tag.auto{color:var(--blue)}.tag.you{color:var(--brass)}
.list{display:flex;flex-direction:column}
.li{display:flex;align-items:center;gap:12px;min-height:56px;border-bottom:1px solid var(--line2);padding:8px 0;width:100%;background:none;border-left:0;border-right:0;border-top:0;text-align:left}
.li:last-child{border-bottom:0}
.li .t{font-family:var(--mono);font-weight:600;font-size:15px}
.li .n{font-size:12px;color:var(--mut);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.chev{flex-shrink:0;color:var(--mut)}
.nav-row{display:flex;align-items:center;justify-content:space-between;min-height:52px;border:0;border-top:1px solid var(--line);background:none;font-size:15px;text-align:left;padding:0;width:100%;gap:10px}
.nav-row .r{color:var(--mut);font-size:13px;text-align:right}
.seg{display:flex;background:var(--card);border-radius:22px;padding:4px;gap:2px}
.seg button{flex:1;min-height:44px;border:0;border-radius:18px;background:none;color:var(--mut);font-size:14px}
.seg button.on{background:var(--tx);color:var(--bg);font-weight:600}
.btn{min-height:48px;border:0;border-radius:14px;background:var(--brass);color:var(--bg);font-weight:600;font-size:15px;padding:0 18px}
.btn.ghost{background:none;border:1px solid var(--edge);color:var(--tx);font-weight:500}
.btn.quiet{background:var(--line);color:var(--mut)}
.btn.sm{min-height:44px;font-size:14px;padding:0 14px}
.btn.full{width:100%}
.pill{min-height:44px;padding:0 14px;border-radius:22px;border:1px solid var(--edge);background:none;color:var(--mut);font-size:14px}
.pill.on{border-color:var(--brass);color:var(--brass)}
input[type=text],input[type=number],input[type=month],input[type=date],select,textarea{width:100%;min-height:48px;border-radius:14px;border:1px solid var(--edge);background:var(--bg);color:var(--tx);padding:0 14px;outline:none}
textarea{padding:12px 14px;min-height:110px;resize:vertical;line-height:1.4}
input:focus,select:focus,textarea:focus{border-color:var(--brass)}
input.amt{font-family:var(--mono);font-size:20px}
label.f{display:block;font-size:13px;color:var(--mut);margin-bottom:6px}
.bar{height:8px;border-radius:4px;background:var(--line);overflow:hidden}
.bar>i{display:block;height:8px;border-radius:4px;background:var(--ok)}
.back{width:44px;height:44px;border-radius:22px;background:var(--card);border:0;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.grid3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.k{font-size:12px;color:var(--mut)}.v{font-family:var(--mono);font-size:17px;font-weight:600}
.dot{width:10px;height:10px;border-radius:3px;flex-shrink:0;display:inline-block}
.empty{color:var(--mut);font-size:14px;padding:18px 0;text-align:center}
nav#tabs{position:fixed;left:0;right:0;bottom:0;z-index:20;background:rgba(12,14,18,.96);backdrop-filter:blur(10px);border-top:1px solid var(--line)}
nav#tabs>div{max-width:480px;margin:0 auto;display:flex;padding:6px 8px calc(10px + env(safe-area-inset-bottom))}
nav#tabs button{flex:1;min-height:52px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;color:var(--mut);font-size:12px;background:none;border:0}
nav#tabs button.on{color:var(--brass);font-weight:600}
#sheet{position:fixed;inset:0;z-index:40;display:none;background:rgba(6,7,10,.72)}
#sheet.on{display:flex;align-items:flex-end;justify-content:center}
#sheet-in{width:100%;max-width:480px;max-height:92vh;overflow-y:auto;background:var(--card);border-radius:24px 24px 0 0;padding:10px 20px calc(24px + env(safe-area-inset-bottom));display:flex;flex-direction:column;gap:16px}
.grab{width:40px;height:4px;border-radius:2px;background:var(--edge);align-self:center}
#toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(92px + env(safe-area-inset-bottom));z-index:60;display:none;max-width:88%;padding:11px 16px;border-radius:14px;color:#0C0E12;font-weight:600;font-size:14px;text-align:center}
#syncline{font-size:12px;color:var(--dim)}
details.x{border-top:1px solid var(--line)}
details.x:last-of-type{border-bottom:1px solid var(--line)}
details.x>summary{list-style:none;display:flex;align-items:center;justify-content:space-between;min-height:52px;font-size:15px;cursor:pointer;gap:10px}
details.x>summary::-webkit-details-marker{display:none}
details.x>summary .r{color:var(--mut);font-size:13px;text-align:right}
details.x>div{font-size:14px;color:var(--mut);padding:0 0 14px;line-height:1.5}
details.x ul{margin:0;padding-left:18px}details.x li{margin-bottom:6px}
.check{display:flex;gap:12px;align-items:flex-start;padding:12px 0;border-bottom:1px solid var(--line2)}
.check:last-child{border-bottom:0}
.check .ic{width:24px;height:24px;border-radius:12px;display:flex;align-items:center;justify-content:center;flex-shrink:0;font-size:13px;font-weight:700;color:var(--bg)}
.lg{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:12px;color:var(--mut)}
.lg span{display:flex;align-items:center;gap:6px}
@media (prefers-reduced-motion:no-preference){.bar>i{transition:width .3s}}
@media print{nav#tabs,#toast,.noprint{display:none!important}body,html{background:#fff;color:#111}.card{background:#f4f4f2}}
</style>
</head>
<body>
<div id="app"><main id="view"></main></div>

<script>
// ════════════════════════════════════════════════════════════════
// CONFIG
// ════════════════════════════════════════════════════════════════
// All personal configuration lives in device localStorage (afc-settings) — nothing sensitive ships in this file.
var SETTINGS_KEY="afc-settings";
function loadSettings(){ try{return JSON.parse(localStorage.getItem(SETTINGS_KEY))||{};}catch(e){return {};} }
function saveSettingsObj(o){ try{localStorage.setItem(SETTINGS_KEY,JSON.stringify(o));}catch(e){} }
var SETTINGS=loadSettings();
var SCRIPT_URL=SETTINGS.scriptUrl||"";
var FINNHUB_KEY=SETTINGS.finnhubKey||"";
var AUTH_TOKEN=SETTINGS.token||"";
var SALARY=parseFloat(SETTINGS.salarySAR)||0, SAR_USD=1/3.75, SAR_PER_USD=3.75; // SAR/USD peg constant 3.75
// Installment amounts come from Settings (type-A / type-B months + maintenance).
var EGP_A=parseFloat(SETTINGS.egpA)||0, EGP_B=parseFloat(SETTINGS.egpB)||0, EGP_AXA=parseFloat(SETTINGS.egpAxa)||0, EGP_M=parseFloat(SETTINGS.egpM)||0;
var PROP_OF_TYPE={A:SETTINGS.propA||"Property A",B:SETTINGS.propB||"Property B"};
var LS_KEY="ahmad-fin-v3";
var LS_KEY_OLD="ahmad-fin-v2"; // migrated on first load
var FIRE_AGE_BASE=parseFloat(SETTINGS.age2026)||0; // age as of mid-2026 (Settings); ageNow() adds elapsed time

var CATS=[
  {k:"food", l:"Food Delivery",  c:"#E8A838"},
  {k:"ride", l:"Ride Hailing",   c:"#5B9BE2"},
  {k:"shop", l:"Shopping",       c:"#A78BFA"},
  {k:"rest", l:"Restaurants",    c:"#E25B5B"},
  {k:"fun",  l:"Entertainment",  c:"#34C9A3"},
  {k:"groc", l:"Groceries",      c:"#7AABCC"},
  {k:"health",l:"Health",        c:"#F0A0A0"},
  {k:"flights",l:"Flights",      c:"#F0834B"},
  {k:"cash", l:"Cash",           c:"#A0A0A0"},
  {k:"charity",l:"Charity",      c:"#A9B83B"},
  {k:"work", l:"Work",           c:"#64748B"},
  {k:"other",l:"Other",          c:"#888888"}
];
// Fixed donut ring order — keeps confusable hues (violet/blue, the grays) apart.
// v4.2: Charity (gold-green) sits between violet and teal; Work (slate) between pink and orange.
var CAT_RING_ORDER=["food","ride","rest","shop","charity","fun","health","work","flights","groc","cash","other"];

// ════════════════════════════════════════════════════════════════
// TIERS — sleeves per TARGET PORTFOLIO v5 (confirmed 2026-10-07); keys unchanged so the Positions sheet keeps parsing
// ════════════════════════════════════════════════════════════
// Function-led SLEEVES. Variable kept as TIERS so downstream code works.
var TIERS=[
  {k:"etf", name:"ETF Core & Ballast",   c:"#D4A84B", rule:"v6 PASSIVE 50% — VALL 40% (legacy VOO / Al Rajhi inside it) · IGLN 5% (legacy GLD inside) · IUES 5% · floor 50% by 2027-09-30 (35% by 2026-12-31) · lines are cost basis"},
  {k:"ai",  name:"AI Infra & Semis",     c:"#5B9BE2", rule:"Mag-7 7.5% (NVDA GOOGL AMZN, 2.5% each) + AI/semis 10% (TSM 2 · AVGO 2 · MU NBIS COHR ANET 1.5) · look-through tech ceiling 45% · NVDA grandfathered"},
  {k:"saas",name:"Software Platforms",   c:"#34C9A3", rule:"SaaS 7.5% — NOW SNOW DDOG CRWD ZETA 1.5% each · line full = no adds; winners run · CRWD grandfathered · NOW: Q4 cRPO <19% in Jan = sell"},
  {k:"pwr", name:"Power & Uranium",      c:"#6FCBE8", rule:"No v6 seats — CEG and CCJ are swings (run-off list)"},
  {k:"con", name:"Consumer & Commerce",  c:"#A78BFA", rule:"Consumer 7% — MELI ELF SHOP 2% · CELH 1% (3-year hold, trimmed to the line 2026-10-30) · SHOP grandfathered"},
  {k:"hlth",name:"Health & Bio",         c:"#F0A0A0", rule:"Health & Bio 4% — LLY 2% (ladder 980/900/820) + ARGX 2% (T1 ≤$900) · both unheld 2026-11-01"},
  {k:"adt", name:"AdTech & Data",        c:"#F0834B", rule:"No plan seats — TTD is a swing (run-off list)"},
  {k:"moon",name:"Moonshots",            c:"#E879F9", rule:"Moonshots 2% — NTLA 1% + HSAI 1%"},
  {k:"swg", name:"Swing Book",           c:"#C3E04D", rule:"v6: 5% = five $8K seats, opening only once the 27-name run-off list (Floors v2) is under $40K · level / floor / date on every name · NO ADDS (rule 18) · proceeds → VALL"},
  {k:"exit",name:"Harvest / Exit",       c:"#E25B5B", rule:"Dated exits; after the date → market; proceeds → VALL"},
  {k:"ext", name:"Crypto / External",    c:"#8A93A6", rule:"Crypto 2% — SOL 1% + ATOM 0.5% + FET 0.5% (OKX spot only, 6-month dates); MSTR is a sunset swing ($220 / $120 / 2027-06-30)"}
];
function tierOf(k){for(var i=0;i<TIERS.length;i++){if(TIERS[i].k===k)return TIERS[i];}return TIERS[4];}
// Sleeve-name → key map for parsing the master sheet.
var SLEEVE_MAP={"ETF Core":"etf","AI Infra":"ai","Software":"saas","Power":"pwr","Consumer":"con","Health":"hlth","AdTech":"adt","Industrial":"pwr","Moonshot":"moon","Swing":"swg","Swing Book":"swg","EXIT":"exit","External":"ext"};
// Raw status → thesis status key map.
var RAWSTATUS_MAP={"DCA":"intact","DCA-NEW":"building","AT TARGET":"intact","AT CAP":"intact","HOLD":"intact","BUILD":"building","TRIM":"weakening","GATED":"weakening","EXIT":"exit","RIDER":"exit","BAND":"exit"};
// Donut ring order for sleeves.
var TIER_RING_ORDER=["etf","ai","saas","pwr","con","hlth","adt","moon","swg","exit","ext"];

// ════════════════════════════════════════════════════════════════
// GOVERNANCE BUCKETS — v3.1 caps & floors; membership moves ONLY at monthly change-control (last Saturday)
// ════════════════════════════════════════════════════════════
// AI-complex = the 'ai' sleeve plus AI-linked names living in other sleeves. Computed live.
var AI_EXTRA=["IREN","APLD"]; // GOOGL moved INTO the 'ai' sleeve at v3.1 (2026-08-07)
var AI_CAP=25, MOON_CAP=5; // retired gauges (v3.1) — kept so old references cannot break
var SINGLE_CAP=5, CORE_FLOOR=50; // v3 (2026-09-18): 5% of book per single stock · passive floor 50% by 2027-09-30
var SWING_CAP=40000;                        // v6 (2026-10-29): swing book 5% of the plan = five $8K seats ($40K); the current run-off list is outside the cap
var SWING_CLUSTER=[];                       // v4-draft "AI-datacenter trio" cap retired by v5 (2026-10-07)
var SWING_CLUSTER_CAP=16000;
var PASSIVE_DEADLINE="2027-09-30";
function isExitPos(p){return p.status==="exit"||p.status==="broken";}
// Crypto rows (OKX spot) live in the "ext" sleeve with a "-USD" ticker (ATOM-USD, FET-USD) so the equity quote feed
// can never mistake them for Atomera / Forum Energy. isCrypto() is the one test every rule uses.
function isCrypto(p){return p.tier==="ext"||/-USD$/.test(String(p.t||""));}
// A "single stock" for the 5% ceiling = anything that is not an ETF row and not crypto (v5: ETFs and crypto exempt).
function isSingleStock(p){return p.tier!=="etf"&&!isCrypto(p);}
// Passive = ETF sleeve rows that are not exits (QQQ is an exit). Crypto is its own 2% line under v5, not passive. Cash is NOT passive.
function passiveValue(){
  return getPositions().filter(function(p){return p.qty>0&&p.tier==="etf"&&!isExitPos(p);}).reduce(function(s,p){return s+posVal(p);},0);
}
function swingValue(){return tierValue("swg");}
function softwareTarget(){return getPositions().filter(function(p){return p.tier==="saas";}).reduce(function(s,p){return s+(p.target||0);},0);}
function aiComplexValue(){return tierValue("ai")+bucketValue(AI_EXTRA);}
// v5 exit list (ruled 2026-09-30): every swing carries a level, a floor and a date; proceeds → VALL.
var HARVEST_TARGET=160000; // v5 funding check (2026-10-06): exit list expected to release $140-180K → VALL
// Exit-proceeds baseline — share counts of the 26 exit-list names at the 2026-10-09 close (no exit-list name had been
// SOLD since the 2026-09-30 ruling; the only sale was QQQ, 20.7026 sh on 2026-10-02). Names bought since are held at the
// current count, so adds never show as negative proceeds. Harvested = (baseline qty − current qty) × price; self-updates on Pull.
// The v3.1 program (2026-08-07 → 2026-09-30, ≈$115K incl. ZS/CRM/ADBE/UBER/BMRN/TEM/BABA/SKHY/LUNR) is closed history — see the journal.
var HARVEST_BASELINE={
  QQQ:{q:20.7026,p:750.65},
  ADBE:{q:63.2926,p:242.27}, INTU:{q:42.3794,p:302.00}, TTD:{q:1066.9874,p:12.10}, NVO:{q:324.2111,p:38.64},
  MSTR:{q:144.0704,p:154.90}, CDNS:{q:30.0492,p:352.84}, CCJ:{q:45,p:88.06}, CEG:{q:22.54,p:298.07},
  IREN:{q:252,p:35.21}, APLD:{q:233,p:23.59}, AMPX:{q:677,p:9.44}, FSLR:{q:33,p:177.82}, ENPH:{q:171,p:32.69},
  INOD:{q:107,p:62.30}, PLAB:{q:241,p:29.62}, MRAM:{q:422,p:16.22}, APP:{q:47,p:276.61}, TMDX:{q:81,p:77.87},
  WYFI:{q:441,p:15.75}, VISN:{q:965,p:6.02}, GRAB:{q:2428,p:3.19}, BEAM:{q:155,p:25.75}, RGTI:{q:360,p:14.03},
  NNE:{q:286,p:15.36}, SERV:{q:1129.7698,p:4.35}, OPTT:{q:351,p:0.85}
};
function harvestDone(){
  var byT={}; getPositions().forEach(function(p){ byT[p.t]=p; });
  var total=0;
  Object.keys(HARVEST_BASELINE).forEach(function(t){
    var b=HARVEST_BASELINE[t], cur=byT[t];
    var curQty=cur?(parseFloat(cur.qty)||0):0;
    var sold=b.q-curQty;
    if(sold>0.0001){ var px=(cur&&cur.price>0)?cur.price:b.p; total+=sold*px; }
  });
  return total;
}
// Rolling high-water NAV → current drawdown vs the −12%/−18% kill-switches.
function drawdownNow(){
  var nav=liveNLV();
  if(!nav||nav<=0) return null;
  if(!S.navHighWater||nav>S.navHighWater){ S.navHighWater=nav; saveState(); return {dd:0,hw:nav}; }
  return {dd:(nav-S.navHighWater)/S.navHighWater*100, hw:S.navHighWater};
}

// ════════════════════════════════════════════════════════════════
// POSITIONS — Strategy v3.1 go-live book, live IBKR pull 2026-08-07
// (NAV $571,293 · cash +$28,988 · leverage 0.95x). Targets v3.1
// (2026-08-07 ratified): 60/40 core-satellite, 20 conviction
// slots, moonshots IREN/APLD/NTLA, exits = strength-harvest ladders.
// VOO INCLUDES Al Rajhi 18 sh (permanent rule 2026-08-07).
// ev = next known event. Maintain via Sheets → Pull.
// ════════════════════════════════════════════════════════════════
var POSITIONS_SEED=[]; // book lives in Sheets + this device only

var DY_SEED={};
var CH_SEED={};
// Apply both seeds to POSITIONS_SEED (dy where 0/unset, channel where empty).
POSITIONS_SEED.forEach(function(p){
  if(!p.dy) p.dy=DY_SEED[p.t]||0;
  if(!p.channel) p.channel=CH_SEED[p.t]||"";
});

var STATUS_META={
  strengthening:{c:"#34C9A3",l:"Strengthening"},
  intact:{c:"#5B9BE2",l:"Intact"},
  weakening:{c:"#E8A838",l:"Weakening"},
  broken:{c:"#E25B5B",l:"Broken"},
  building:{c:"#A78BFA",l:"Building"},
  exit:{c:"#E25B5B",l:"Exit"}
};

// Governance — TARGET PORTFOLIO v6 (locked 2026-10-29; $800K by 2027-12-31; cost-basis lines). Text refresh 2026-11-01 (no feature changes). governance.md applies only where v6 is silent.
var RULES=[
 ["The law (v6, 2026-10-29)","$800K by 2027-12-31. Lines are COST BASIS (money paid in), never market value — they cap capital in and are never a buy signal. Cash 5% · Passive 50% (VALL 40 · IGLN 5 · IUES 5; legacy VOO inside VALL, GLD inside IGLN) · Mag-7 7.5% (NVDA GOOGL AMZN 2.5) · AI/semis 10% (TSM 2 · AVGO 2 · MU NBIS COHR ANET 1.5) · SaaS 7.5% (NOW SNOW DDOG CRWD ZETA 1.5) · Consumer 7% (MELI ELF SHOP 2 · CELH 1) · Health & Bio 4% (LLY 2 · ARGX 2) · Moonshots 2% (NTLA 1 · HSAI 1) · Crypto 2% (SOL 1 · ATOM 0.5 · FET 0.5) · Swings 5% (five $8K seats). Grandfathered over their lines: NVDA, CRWD, SHOP."],

function dedupeByMonth(arr){
  // Last entry per month wins. Months are NORMALIZED first (parseMonth) so
  // "2026-06" and a Sheets date-cell like "Mon Jun 01 2026..." collapse into
  // one key — this was the root of the duplicated May/Jun history cards.
  var map={};
  (arr||[]).forEach(function(x){
    if(!x||!x.month) return;
    var m=parseMonth(x.month);
    if(!/^\d{4}-\d{2}$/.test(m)) m=String(x.month).trim();
    x.month=m;
    map[m]=x;
  });
  return Object.keys(map).sort().map(function(m){return map[m];});
}

function parseMonth(val){
  if(!val) return "";
  var s=String(val).trim();
  if(/^\d{4}-\d{2}$/.test(s)) return s;
  if(/^\d{4}-\d{2}-\d{2}/.test(s)) return s.slice(0,7);
  // Sheets date-cells arrive as "Mon Jun 01 2026 00:00:00 GMT+0300" — read the
  // month NAME directly (new Date() shifts a month across timezones).
  var MN={jan:"01",feb:"02",mar:"03",apr:"04",may:"05",jun:"06",jul:"07",aug:"08",sep:"09",oct:"10",nov:"11",dec:"12"};
  var m=s.toLowerCase().match(/\b(jan|feb|mar|apr|may|jun|jul|aug|sep|oct|nov|dec)[a-z]*\b[^0-9]*(?:\d{1,2}[^0-9]+)?(\d{4})/);
  if(m&&m[2]) return m[2]+"-"+MN[m[1]];
  try{var d=new Date(s);if(!isNaN(d.getTime()))return d.getFullYear()+"-"+("0"+(d.getMonth()+1)).slice(-2);}catch(e){}
  return s.slice(0,7);
}
function nowM(){var d=new Date();return d.getFullYear()+"-"+("0"+(d.getMonth()+1)).slice(-2);}
function toDay(){var d=new Date();return d.getFullYear()+"-"+("0"+(d.getMonth()+1)).slice(-2)+"-"+("0"+d.getDate()).slice(-2);}

// ════════════════════════════════════════════════════════════════
function calcFire(spend,swr,ret,contrib,rental,divIncome,start){
  var fn=(spend-rental-(divIncome||0))/(swr/100);
  if(fn<=0) fn=1;
  var mr=(ret/100)/12;
  var v=(start!==undefined?start:liveNLV()), m=0;
  var v0=v;
  while(v<fn&&m<600){v=v*(1+mr)+contrib;m++;}
  return {fn:fn,years:(m/12).toFixed(1),age:Math.round(ageNow()+m/12),pct:Math.min(100,(v0/fn)*100)};
}
// Coast: portfolio needed TODAY so pure compounding (zero further contributions)
// reaches the traditional number by coastAge.
function calcCoast(tradFn,ret,coastAge){
  var yrs=Math.max(0,coastAge-ageNow());
  var need=tradFn/Math.pow(1+ret/100,yrs);
  var nlv=liveNLV();
  // years until coast number is reached at current contribution pace
  var mr=(ret/100)/12, v=nlv, m=0;
  while(v<need&&m<600){v=v*(1+mr)+S.fire.contrib;m++;}
  return {fn:need,pct:Math.min(100,(nlv/need)*100),years:(m/12).toFixed(1),age:Math.round(ageNow()+m/12)};
}

function deriveEv(gate){
  var g=String(gate||"").trim();
  if(!g||g==="—") return "";
  var iso=g.match(/(\d{4})-(\d{2})-(\d{2})/);
  if(iso) return iso[0]+"·"+g;
  var m=g.match(/\b(Jan|Feb|Mar|Apr|May|Jun|Jul|Aug|Sep|Oct|Nov|Dec)\s+(\d{1,2})\b/i);
  if(m){
    // v5.3: no hard-coded year — use this year, or next year when that date is already well behind us
    var now=new Date(), yr=now.getFullYear();
    var md=MONTH_ABBR[m[1].toLowerCase()]+"-"+("0"+parseInt(m[2],10)).slice(-2);
    if(new Date(yr+"-"+md+"T00:00:00").getTime()<now.getTime()-60*86400000) yr+=1;
    return yr+"-"+md+"·"+g;
  }
  return "";
}

  // tier has no crypto quotes the row simply keeps the sheet Px — it is never priced off the equity ticker.
  function quoteSymbol(p){
    if(isCrypto(p)) return "BINANCE:"+String(p.t).replace(/-USD$/,"")+"USDT";
    return p.t;
  }
  function fetchQuote(p){
    return fetch("https://finnhub.io/api/v1/quote?symbol="+encodeURIComponent(quoteSymbol(p))+"&token="+FINNHUB_KEY)
      .then(function(r){
        if(r.status===429){rateLimited=true;return null;}
        if(r.status===401||r.status===403){authFail=true;return null;}
        return r.json();
      })
      .then(function(d){
        if(d&&d.c&&d.c>0){p.price=isCrypto(p)?Math.round(d.c*10000)/10000:Math.round(d.c*100)/100;updated++;}
        else if(!rateLimited&&!authFail) failed.push(p);
      })
      .catch(function(){failed.push(p);});
  }

  function runQueue(list,done){
    var chunks=[];
    for(var i=0;i<list.length;i+=8) chunks.push(list.slice(i,i+8));
    function step(idx){
      if(idx>=chunks.length||rateLimited||authFail){done();return;}
      Promise.all(chunks[idx].map(fetchQuote)).then(function(){
        setTimeout(function(){step(idx+1);},1200);
      });
    }
    step(0);
  }

  function finish(){
    if(updated>0) S.lastRefresh=Date.now();
    S.positions=pos;
    saveState();softRender();
    if(!silent){
      if(authFail) toast("Finnhub rejected the API key — it needs replacing",true);
      else if(rateLimited) toast("Finnhub rate limit — updated "+updated+" of "+pos.length+", retry in a minute",updated===0);
      else if(failed.length) toast("Prices updated: "+updated+" of "+pos.length+" ("+failed.length+" unavailable)",updated===0);
      else toast("Prices updated: "+updated+" names");
    }
    if(btn){btn.textContent="↻ Refresh live prices";btn.disabled=false;}
    refreshing=false;
  }

  runQueue(pos,function(){
    if(failed.length&&!rateLimited&&!authFail){
      var retry=failed.slice(); failed=[];
      setTimeout(function(){ runQueue(retry,finish); },2500);
    } else finish();
  });
}

function wealthTotals(){

function confirmCloseMonth(nm){
  var c=closeMonthCalc(nm), ts=c.ts;
  var spIbkr=0,spRoll=0,spSave=0,goalId="";
  if(ts>0){
    spIbkr=Math.max(0,parseFloat((document.getElementById("cm-ibkr")||{}).value)||0);
    spRoll=Math.max(0,parseFloat((document.getElementById("cm-roll")||{}).value)||0);
    spSave=Math.max(0,parseFloat((document.getElementById("cm-save")||{}).value)||0);
    goalId=(document.getElementById("cm-goal")||{}).value||"";
    if(spIbkr+spRoll+spSave>ts+0.01){
      var err=document.getElementById("cm-err");
      if(err) err.textContent="Split exceeds the surplus — sum must be ≤ SAR "+fS(ts)+".";
      toast("Split exceeds the surplus",true);
      return;
    }
    if(spSave>0&&!goalId){toast("Pick a savings goal for the savings portion",true);return;}
  }
  var toI=Math.max(0,c.inv)+spIbkr;
  var split={ibkr:Math.round(spIbkr),roll:Math.round(spRoll),save:Math.round(spSave),goal:goalId};
  var capsOut=Object.assign({},S.caps); capsOut.__split=split; // extends the caps JSON — backward compatible
  var rec={month:nm,cats:Object.assign({},c.sp),caps:capsOut,investedSAR:Math.round(toI),investedUSD:Math.round(toI*SAR_USD),surplusSAR:ts,fixedTotal:Math.round(c.ft),totalOut:Math.round(c.to),rollMode:S.rollMode,split:split};
  S.monthHistory=S.monthHistory.filter(function(h){return String(h.month).trim()!==nm;});
  S.monthHistory.push(rec);
  S.monthHistory=dedupeByMonth(S.monthHistory);
  // Savings portion auto-logs to the chosen goal (USD at the 3.75 peg).
  if(spSave>0&&goalId){
    var g=((S.savings&&S.savings.goals)||[]).find(function(x){return x.id===goalId;});
    if(g){
      var usd=Math.round(spSave*SAR_USD);
      g.log=g.log||[];
      g.log.push({date:toDay(),amount:usd,src:"month-close "+nm});
      g.savedUSD=(g.savedUSD||0)+usd;
    }
  }
  // Wealth trend — append this month's net-worth snapshot.
  if(S.wealth){
    S.wealth.history=(S.wealth.history||[]).filter(function(h){return h.month!==nm;});
    S.wealth.history.push({month:nm,netWorthUSD:Math.round(wealthTotals().net)});
  }
  saveState();cancelCloseMonth();render();
  var row=[rec.month,rec.investedSAR,rec.investedUSD,rec.surplusSAR,rec.fixedTotal,rec.totalOut,rec.rollMode,JSON.stringify(rec.cats),JSON.stringify(rec.caps)];
  // Find an existing row for this month and overwrite it; append only if absent.
  sheetsRead("Monthly","A2:A500").then(function(rows){
    var rowNum=-1;
    rows.forEach(function(r,i){ if(r[0]&&String(r[0]).trim()===nm) rowNum=i+2; });
    if(rowNum>0) return sheetsWrite("Monthly",row,rowNum);
    return sheetsAppend("Monthly",row);
  }).then(function(){toast("Month closed and recorded");})
  .catch(function(){
    sheetsAppend("Monthly",row).then(function(){toast("Month closed and recorded");}).catch(function(){toast("Closed on this device — Sync when online",true);});
  });
}

  html+='<div class="card"><h2 style="margin-bottom:6px">Still open</h2><div class="sub">'+(d.exits?d.exits+" exit"+(d.exits>1?"s":"")+" you ruled on and have not done. ":"No exits waiting. ")+(unclosedMonths().length?unclosedMonths().length+" month"+(unclosedMonths().length>1?"s":"")+" not closed. ":"")+'</div></div>';
  html+='<div class="row noprint"><button class="btn grow" data-act="share">Share as text</button><button class="btn ghost grow" data-act="print">Print or save PDF</button></div>';
  return html;
}

  cat:function(d){S.selCat=d.k;saveState();var a=val("tx-amt"),n=val("tx-note");render();if($("tx-amt"))$("tx-amt").value=a;if($("tx-note"))$("tx-note").value=n;},

  savAdd:function(d){ var g=savFind(d.id), amt=num(val("sav-amt-"+d.id)); if(!g) return; if(!(amt>0)){toast("Enter an amount first",true);return;} g.log=g.log||[]; g.log.push({date:toDay(),amount:Math.round(amt)}); g.savedUSD=(parseFloat(g.savedUSD)||0)+Math.round(amt); saveState(); render(); savingsPush().then(function(){toast("Added "+fU(amt)+" to "+g.name);}).catch(function(){toast("Saved on this phone only for now",true);}); },

  undoPaid:function(d){ var r=wSchedule().find(function(x){return String(x.id)===String(d.id);}); if(!r) return; r.paid=false; r.paidDate=""; saveState(); render(); wealthPush().catch(function(){}); },
  wAdd:function(){wState().assetsManual.push({id:"m"+Date.now(),name:"",usd:0});saveState();render();},
  wDel:function(d){ if(!confirm2("wd"+d.i,"Tap × again to remove it")) return; wState().assetsManual.splice(+d.i,1); saveState(); render(); wealthPush().catch(function(){}); },
  dep:function(){ var m=val("dep-m"), a=num(val("dep-a")); if(!m||!(a>0)){toast("Enter the month and the amount",true);return;} S.ibkrHistory=S.ibkrHistory.filter(function(h){return h.month!==m;}); S.ibkrHistory.push({month:m,usd:a}); saveState(); saveSetting("ibkrHistory",S.ibkrHistory); render(); toast("Deposit recorded"); },
  estate:function(d){ S.estate=S.estate||{}; var e=S.estate[d.k]||{}; S.estate[d.k]=e.done?{done:false,note:e.note}:{done:true,note:e.note,date:toDay()}; saveState(); render(); },
  famAdd:function(d){ if(d.kind==="plan") S.family.plan.push({n:"New line",a:0}); else famList(d.kind).push({t:"",sh:0,usd:0}); saveState(); render(); },
  famDel:function(d){ if(!confirm2("fd"+d.kind+d.i,"Tap × again to remove it")) return; famList(d.kind).splice(+d.i,1); saveFam(); render(); },

  share:function(){ var d=monthPage(), txt=new Date(d.m+"-01T00:00:00").toLocaleDateString("en-GB",{month:"long",year:"numeric"})+"\nNet value: "+fU(d.nlv)+(d.pf?"\nMonth: "+pct(d.pf.ibkr)+" (S&P "+pct(d.pf.sp)+")":"")+"\nSpent: SAR "+fS(d.spent)+(d.h?"\nTo IBKR: "+fU(d.h.investedUSD||0):"")+"\nIndex and gold: "+d.pass.toFixed(0)+"%\nCash: "+d.cashPct.toFixed(1)+"%\nAbove cost: "+d.up.map(function(p){return p.t+" "+pct(posPct(p),0);}).join(", ")+"\nBelow cost: "+d.dn.map(function(p){return p.t+" "+pct(posPct(p),0);}).join(", ");
    if(navigator.share) navigator.share({title:"Month-end",text:txt}).catch(function(){}); else if(navigator.clipboard) navigator.clipboard.writeText(txt).then(function(){toast("Copied");}); },
